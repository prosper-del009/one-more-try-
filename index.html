<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="ONE MORE TRY : le jeu de plateforme impossible où le chantier te ment. Jouable sur téléphone et ordinateur.">
<meta property="og:title" content="ONE MORE TRY · Le jeu impossible">
<meta property="og:description" content="Atteins la porte. Le chantier, lui, a d'autres plans.">
<meta property="og:type" content="website">
<meta name="theme-color" content="#0F1320">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230F1320'/%3E%3Crect x='9' y='13' width='14' height='13' rx='3' fill='%23FF8B3D'/%3E%3Cpath d='M7 14a9 7 0 0 1 18 0z' fill='%23FFC93C'/%3E%3Crect x='12' y='17' width='3' height='4' fill='%23fff'/%3E%3Crect x='17' y='17' width='3' height='4' fill='%23fff'/%3E%3C/svg%3E">
<title>One More Try</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Rubik:wght@400;500;700&display=swap">
<style>
/* Layout: une scène de jeu 16:9 centrée, barre d'outils au-dessus, manette tactile en dessous
   (superposée en paysage). Univers « chantier de nuit » : béton, acier, jaune sécurité.
   Thème sombre unique, choisi pour le jeu. */
:root{
  color-scheme:dark;
  --bg:#0F1320;
  --bg-2:#161B2B;
  --panel:#1F263A;
  --line:#2F3852;
  --fg:#F4F1E8;
  --fg-2:#A8B0C6;
  --hazard:#FFC93C;
  --on-hazard:#1C1705;
  --hot:#FF8B3D;
  --go:#3FD08A;
  --f-display:"Bungee",Impact,"Arial Black",sans-serif;
  --f-body:"Rubik",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-body);overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--hazard);outline-offset:2px}

.app{position:relative;height:100%;display:flex;flex-direction:column;gap:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px max(10px,env(safe-area-inset-bottom,0px))}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:40px}
.logo{font-family:var(--f-display);font-size:1.05rem;letter-spacing:.01em;white-space:nowrap}
.logo b{font-weight:400;color:var(--hazard)}
.tools{display:flex;gap:8px}
.tool{display:grid;place-items:center;min-width:42px;height:40px;padding:0 10px;border-radius:12px;border:1px solid var(--line);background:var(--panel);cursor:pointer;font-weight:700;font-size:.85rem;letter-spacing:.04em}
.tool:hover{border-color:var(--hazard)}
.tool svg{width:20px;height:20px}
.tool[aria-pressed="false"] .on,.tool[aria-pressed="true"] .off{display:none}

.stage{position:relative;flex:1;min-height:0;display:grid;place-items:center}
canvas{display:block;border-radius:14px;background:var(--bg-2);box-shadow:0 0 0 1px var(--line),0 24px 60px -24px rgba(0,0,0,.7);touch-action:none;cursor:pointer}
.keys{margin:0;text-align:center;font-size:.85rem;color:var(--fg-2)}
.keys kbd{font:600 .78rem var(--f-body);padding:2px 7px;border:1px solid var(--line);border-bottom-width:2px;border-radius:6px;background:var(--panel);color:var(--fg)}
.tip{display:none;margin:0;text-align:center;font-size:.85rem;color:var(--fg-2)}

.pad{display:none;align-items:center;justify-content:space-between;gap:16px;touch-action:none}
.pad .dir{display:flex;gap:12px}
.pbtn{display:grid;place-items:center;width:78px;height:78px;border-radius:24px;border:1px solid var(--line);background:var(--panel);color:var(--fg);touch-action:none;-webkit-user-select:none;user-select:none}
.pbtn svg{width:30px;height:30px;pointer-events:none}
.pbtn.jump{width:96px;height:96px;border-radius:50%;background:var(--hazard);color:var(--on-hazard);border-color:var(--hazard)}
.pbtn.on{background:var(--fg);color:var(--bg)}
.pbtn.jump.on{background:var(--hot);border-color:var(--hot)}

.coarse .pad{display:flex}
.coarse .keys{display:none}
@media (orientation:portrait){.coarse .tip{display:block}}
@media (orientation:landscape) and (max-height:540px){
  .coarse.app{padding-block:6px}
  .coarse .logo{display:none}
  .coarse .bar{position:absolute;top:6px;right:max(12px,env(safe-area-inset-right,0px));z-index:4;min-height:0}
  .coarse .tools{flex-direction:column;gap:6px}
  .coarse .tool{height:34px;min-width:36px;padding:0 6px}
  .coarse .stage{padding:0 96px 0 140px}
  .coarse .pad{position:absolute;left:0;right:0;bottom:0;z-index:3;pointer-events:none;padding:0 max(12px,env(safe-area-inset-right,0px)) max(10px,env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
  .coarse .pad .dir{gap:8px}
  .coarse .pbtn{pointer-events:auto;width:60px;height:60px;border-radius:20px}
  .coarse .pbtn.jump{width:76px;height:76px;border-radius:50%}
}

.end{position:absolute;inset:0;margin:auto;width:min(92%,380px);height:fit-content;max-height:100%;overflow:auto;padding:22px 20px 18px;border-radius:18px;background:var(--bg-2);border:1px solid var(--line);box-shadow:0 30px 80px -20px rgba(0,0,0,.8);text-align:center;z-index:5}
.end-k{margin:0;font:700 .72rem/1.3 var(--f-body);letter-spacing:.14em;text-transform:uppercase;color:var(--fg-2)}
.end h2{margin:6px 0 14px;font:400 2rem/1 var(--f-display);color:var(--hazard)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0 0 16px}
.stats div{padding:10px;border:1px solid var(--line);border-radius:12px;background:var(--panel)}
.stats dt{font:700 .68rem/1.2 var(--f-body);letter-spacing:.12em;text-transform:uppercase;color:var(--fg-2)}
.stats dd{margin:4px 0 0;font:400 1.5rem/1 var(--f-display);font-variant-numeric:tabular-nums}
.end-actions{display:grid;gap:8px}
.cta{padding:13px 16px;border-radius:12px;border:1px solid var(--hazard);background:var(--hazard);color:var(--on-hazard);font-weight:700;font-size:1rem;cursor:pointer}
.cta.ghost{background:transparent;color:var(--fg);border-color:var(--line)}
.end-note{min-height:1.2em;margin:10px 0 0;font-size:.85rem;color:var(--go)}
.share-text{display:block;margin-top:8px;padding:8px 10px;border-radius:8px;background:var(--panel);color:var(--fg);font-size:.8rem;text-align:left;-webkit-user-select:all;user-select:all;overflow-wrap:anywhere}
</style>
</head>
<body>
<div class="app" id="app">
  <header class="bar">
    <div class="logo">ONE MORE <b>TRY</b></div>
    <div class="tools">
      <button class="tool" id="b-restart" type="button" aria-label="Recommencer" title="Recommencer">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.4-5.7"/><path d="M4 4v5h5"/></svg>
      </button>
      <button class="tool" id="b-sound" type="button" aria-pressed="true" aria-label="Son">
        <svg class="on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/><path d="M19 6a8.5 8.5 0 0 1 0 12"/></svg>
        <svg class="off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M17 9l5 6M22 9l-5 6"/></svg>
      </button>
      <button class="tool" id="b-lang" type="button" aria-label="Language">EN</button>
    </div>
  </header>

  <div class="stage" id="stage">
    <canvas id="cv" width="480" height="270" aria-label="ONE MORE TRY"></canvas>
    <div class="end" id="end" hidden>
      <p class="end-k" data-s="endK">6 niveaux terminés</p>
      <h2 data-s="endT">Terminé !</h2>
      <dl class="stats">
        <div><dt data-s="statD">Essais</dt><dd id="st-d">0</dd></div>
        <div><dt data-s="statT">Temps</dt><dd id="st-t">0:00</dd></div>
      </dl>
      <div class="end-actions">
        <button class="cta" id="b-share" type="button" data-s="share">Partager mon score</button>
        <button class="cta ghost" id="b-replay" type="button" data-s="replay">Rejouer</button>
      </div>
      <p class="end-note" id="share-note" aria-live="polite"></p>
    </div>
  </div>

  <p class="keys" id="keys"><kbd>←</kbd> <kbd>→</kbd> <span data-s="kMove">bouger</span> · <kbd>Espace</kbd> <span data-s="kJump">sauter</span> · <kbd>R</kbd> <span data-s="kR">recommencer</span></p>
  <p class="tip" data-s="tip">Astuce : tourne ton téléphone pour jouer en grand.</p>

  <div class="pad" id="pad">
    <div class="dir">
      <button class="pbtn" type="button" data-k="left" aria-label="Gauche"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M16 4v16L5 12z"/></svg></button>
      <button class="pbtn" type="button" data-k="right" aria-label="Droite"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 4v16l11-8z"/></svg></button>
    </div>
    <button class="pbtn jump" type="button" data-k="jump" aria-label="Sauter"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5"/><path d="M5 11l7-7 7 7"/></svg></button>
  </div>
</div>

<script>
(() => {
"use strict";

/* =========================================================
   TEXTES
   ========================================================= */
const STR = {
  fr: {
    sub: "Le jeu impossible",
    tap: "Touche l'écran pour jouer",
    key: "Appuie sur Espace pour jouer",
    resume: (n, d) => `Reprendre au niveau ${n} · ${d} essai${d > 1 ? "s" : ""}`,
    lvl: "NIV.", attempt: "ESSAI", total: "TOTAL", level: "NIVEAU",
    quips: ["Personne ne l'avait vue venir.", "Encore un essai.", "Presque. Ou pas.", "Le chantier, c'est dangereux.", "Tu vas l'avoir.", "Respire. Recommence.", "Ça, c'était prévisible.", "Le béton ne pardonne pas.", "Casque : 1. Toi : 0."],
    fake: "C'était trop facile, non ?",
    endK: "6 niveaux terminés", endT: "Terminé !", statD: "Essais", statT: "Temps",
    share: "Partager mon score", replay: "Rejouer",
    copied: "Score copié. Colle-le où tu veux.", shared: "Merci pour le partage !",
    manual: "Copie ce texte pour le partager :",
    shareTxt: (d, t) => `J'ai terminé ONE MORE TRY en ${d} essais (${t}). Tu feras mieux ?`,
    kMove: "bouger", kJump: "sauter", kR: "recommencer",
    tip: "Astuce : tourne ton téléphone pour jouer en grand.",
    restart: "Recommencer", sound: "Son", lang: "EN"
  },
  en: {
    sub: "The impossible game",
    tap: "Tap the screen to play",
    key: "Press Space to play",
    resume: (n, d) => `Resume at level ${n} · ${d} tr${d > 1 ? "ies" : "y"}`,
    lvl: "LVL", attempt: "TRY", total: "TOTAL", level: "LEVEL",
    quips: ["Nobody saw that coming.", "One more try.", "Almost. Or not.", "Construction sites are dangerous.", "You've got this.", "Breathe. Retry.", "That was predictable.", "Concrete doesn't forgive.", "Hard hat: 1. You: 0."],
    fake: "Too easy, right?",
    endK: "6 levels cleared", endT: "Done!", statD: "Tries", statT: "Time",
    share: "Share my score", replay: "Play again",
    copied: "Score copied. Paste it anywhere.", shared: "Thanks for sharing!",
    manual: "Copy this text to share it:",
    shareTxt: (d, t) => `I beat ONE MORE TRY in ${d} tries (${t}). Can you do better?`,
    kMove: "move", kJump: "jump", kR: "restart",
    tip: "Tip: turn your phone sideways to play bigger.",
    restart: "Restart", sound: "Sound", lang: "FR"
  }
};

/* =========================================================
   NIVEAUX — grille 30 × 17 cases de 16 px
   '#' béton  'f' faux sol  '=' poutre  'w' échafaudage fragile
   'i' pont invisible  's' ressort
   ========================================================= */
const COLS = 30, ROWS = 17, T = 16, W = 480, H = 270;
const blank = () => Array.from({ length: ROWS }, () => Array(COLS).fill("."));
const fill = (m, c0, c1, r0, r1, ch) => { for (let r = r0; r <= r1; r++) for (let c = c0; c <= c1; c++) m[r][c] = ch; };
const lv = (name, build) => { const m = blank(); const o = build(m); o.m = m; o.name = name; return o; };

const LEVELS = [
  lv({ fr: "Va à la porte.", en: "Reach the door." }, m => {
    fill(m, 0, 29, 14, 16, "#");
    return { spawn: [3, 13], door: { c: 27, r: 13, run: { trig: 21, c: 1, r: 13 } },
      signs: [{ c: 7, r: 13, fr: "PORTE →", en: "DOOR →" }], ents: [] };
  }),
  lv({ fr: "Le sol est solide.", en: "The floor is solid." }, m => {
    fill(m, 0, 29, 14, 16, "#"); fill(m, 11, 13, 14, 14, "f"); fill(m, 11, 13, 15, 16, ".");
    return { spawn: [2, 13], door: { c: 27, r: 13 },
      signs: [{ c: 7, r: 13, fr: "SOL SOLIDE", en: "SOLID FLOOR" }],
      ents: [{ t: "beam", c: 20, r: 3, w: 3, trig: 17.5, shake: 12 }] };
  }),
  lv({ fr: "Monte, c'est sûr.", en: "Hop on. It's safe." }, m => {
    fill(m, 0, 7, 14, 16, "#"); fill(m, 22, 29, 14, 16, "#"); fill(m, 15, 17, 10, 10, "=");
    return { spawn: [2, 13], door: { c: 28, r: 13 },
      signs: [{ c: 4, r: 13, fr: "MONTEZ !", en: "HOP ON!" }],
      ents: [{ t: "mover", c: 8, r: 12, w: 3, c2: 13, sp: 0.75, drop: 12 }, { t: "pop", c: 25, r: 13, w: 2, trig: 24.3 }] };
  }),
  lv({ fr: "Fais-moi confiance.", en: "Trust me." }, m => {
    fill(m, 0, 6, 14, 16, "#"); fill(m, 23, 29, 14, 16, "#"); fill(m, 7, 22, 14, 14, "i");
    return { spawn: [2, 13], door: { c: 27, r: 13 },
      signs: [{ c: 4, r: 13, fr: "CONFIANCE →", en: "TRUST ME →" }],
      ents: [{ t: "beam", c: 14, r: 3, w: 2, trig: 12.2, shake: 6 }] };
  }),
  lv({ fr: "Casque obligatoire.", en: "Hard hat required." }, m => {
    fill(m, 0, 4, 14, 16, "#"); fill(m, 7, 9, 12, 12, "="); fill(m, 12, 14, 12, 12, "=");
    fill(m, 17, 19, 12, 12, "w"); fill(m, 23, 29, 14, 16, "#");
    return { spawn: [1, 13], door: { c: 27, r: 13 }, jib: true,
      signs: [{ c: 3, r: 13, fr: "CASQUE !", en: "HARD HAT!" }],
      ents: [{ t: "hook", pc: 10.5, pr: 0.4, len: 10.6, amp: 0.55, per: 150, ph: 0 },
             { t: "hook", pc: 15.5, pr: 0.4, len: 10.6, amp: 0.55, per: 150, ph: Math.PI }] };
  }),
  lv({ fr: "Dernier niveau ?", en: "Final level?" }, m => {
    fill(m, 0, 29, 14, 16, "#"); m[13][7] = "s"; fill(m, 6, 6, 9, 13, "#"); fill(m, 1, 4, 5, 5, "=");
    return { spawn: [13, 13], door: { c: 2, r: 4 }, fake: { c: 27, r: 13 },
      signs: [{ c: 10, r: 13, fr: "← PAS PAR LÀ", en: "← NOT THIS WAY" }, { c: 20, r: 13, fr: "SORTIE →", en: "EXIT →" }],
      ents: [{ t: "pop", c: 24, r: 13, w: 6, trig: null, id: "trap" }] };
  })
];

/* =========================================================
   PHYSIQUE
   ========================================================= */
const GRAV = 0.38, GRAV_CUT = 0.85, MAXFALL = 7.5, ACC_G = 0.5, ACC_A = 0.34, MAXV = 2.3, JUMP = 6.3, SPRING = 11.5;
const COL = {
  sky0: "#10142A", sky1: "#262B48", city: "#1A2036", city2: "#20273F", star: "rgba(244,241,232,.5)",
  rock: "#545D71", rock2: "#4F586B", lip: "#8E98AC", lip2: "#69728A", crack: "#363D4E",
  steel: "#E07A3A", steelHi: "#F29A5E", steelLo: "#A9532A", plank: "#B9844E", plankLo: "#7A5330", pole: "#5D6780",
  glass: "rgba(95,225,255,.32)", glassLine: "rgba(95,225,255,.75)",
  hazard: "#FFC93C", black: "#1B1A16", rebar: "#D5DBE5", rebarLo: "#8B93A6",
  body: "#FF8B3D", bodyLo: "#D9692A", hat: "#FFC93C", hatLo: "#D9A21F", eye: "#FFFFFF", pupil: "#1B1A16",
  door: "#2FB876", doorHi: "#57D696", doorLo: "#1E7C50", frame: "#16352A",
  fg: "#F4F1E8", fg2: "#A8B0C6", ink: "#0F1320", red: "#FF5A4F", dust: "rgba(200,206,220,.8)"
};

/* =========================================================
   ÉTAT
   ========================================================= */
const cv = document.getElementById("cv"), ctx = cv.getContext("2d");
const app = document.getElementById("app"), stage = document.getElementById("stage");
const endEl = document.getElementById("end");
const REDUCE = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
let k = 1;

const store = {
  get() { try { return JSON.parse(localStorage.getItem("omt-v1") || "{}"); } catch (e) { return {}; } },
  set(v) { try { localStorage.setItem("omt-v1", JSON.stringify(v)); } catch (e) {} }
};
const saved = store.get();
let lang = saved.lang || ((navigator.language || "").toLowerCase().startsWith("fr") ? "fr" : "en");
let muted = !!saved.muted;
let cur = Number.isInteger(saved.cur) && saved.cur < LEVELS.length ? saved.cur : 0;
let totalDeaths = saved.total || 0, playFrames = saved.frames || 0;
const S = () => STR[lang];

let state = "title", frame = 0;
let L, grid, falls, revealed, ents, door, fake, player, parts = [], debris = [];
let levelTries = 0, banner = 0, quip = "", quipT = 0, lastQuip = -1, deadT = 0, winT = 0, shake = 0;

function persist() { store.set({ lang, muted, cur, total: totalDeaths, frames: playFrames }); }

/* =========================================================
   CHARGEMENT
   ========================================================= */
function loadLevel(i, fresh) {
  L = LEVELS[i];
  grid = L.m.map(r => r.slice());
  falls = new Map(); revealed = new Set(); debris = [];
  ents = L.ents.map(makeEnt);
  const d = L.door;
  door = { x: d.c * T, y: (d.r - 1) * T, run: d.run || null, ran: false, tw: null };
  fake = L.fake ? { x: L.fake.c * T, y: (L.fake.r - 1) * T } : null;
  player = { x: L.spawn[0] * T + 3, y: (L.spawn[1] + 1) * T - 13, w: 10, h: 13, vx: 0, vy: 0, ground: false, coyote: 0, buffer: 0, face: 1, on: null, sq: 1, spring: false, run: 0, gone: false };
  if (fresh) { levelTries = 1; banner = 120; }
}
function makeEnt(d) {
  if (d.t === "beam") return { t: "beam", x: d.c * T, y: d.r * T, w: d.w * T, h: 10, trig: d.trig * T, shake: d.shake, st: "idle", n: 0, vy: 0, landY: 0 };
  if (d.t === "pop") return { t: "pop", x: d.c * T, base: (d.r + 1) * T, w: d.w * T, trig: d.trig != null ? d.trig * T : null, h: 0, up: false, id: d.id || null };
  if (d.t === "mover") return { t: "mover", x: d.c * T, y: d.r * T, w: d.w * T, h: 8, x0: d.c * T, x1: d.c2 * T, sp: d.sp, dir: 1, drop: d.drop != null ? d.drop * T : null, fall: false, vy: 0, dx: 0 };
  if (d.t === "hook") return { t: "hook", px: d.pc * T, py: d.pr * T, len: d.len * T, amp: d.amp, per: d.per, ph: d.ph, hx: 0, hy: 0, a: 0 };
  return null;
}

/* =========================================================
   COLLISIONS
   ========================================================= */
const SOLID = "#f=wis";
const tile = (c, r) => (c < 0 || c >= COLS) ? "#" : (r < 0 || r >= ROWS) ? "." : grid[r][c];
function tileBox(ch, c, r) {
  if (ch === "#" || ch === "f" || ch === "i") return { x: c * T, y: r * T, w: T, h: T, ch, c, r };
  if (ch === "=" || ch === "w") return { x: c * T, y: r * T, w: T, h: 8, ch, c, r };
  if (ch === "s") return { x: c * T + 1, y: r * T + 6, w: T - 2, h: T - 6, ch, c, r };
  return null;
}
const hit = (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
function boxesIn(rc) {
  const out = [];
  const c0 = Math.floor(rc.x / T), c1 = Math.floor((rc.x + rc.w - 0.001) / T);
  const r0 = Math.floor(rc.y / T), r1 = Math.floor((rc.y + rc.h - 0.001) / T);

      let x = e.x, y = e.y;
      if (e.st === "shake") x += (Math.random() - 0.5) * 2.5;
      if (e.st === "idle" || e.st === "shake") { ctx.strokeStyle = COL.fg2; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(x + 4, 0); ctx.lineTo(x + 4, y); ctx.moveTo(x + e.w - 4, 0); ctx.lineTo(x + e.w - 4, y); ctx.stroke(); }
      hazardRect(x, y, e.w, e.h);
      ctx.fillStyle = "rgba(0,0,0,.25)"; ctx.fillRect(x, y + e.h - 2, e.w, 2);
    } else if (e.t === "pop") {
      if (e.h <= 0) continue;
      const n = Math.round(e.w / 5.33);
      for (let i = 0; i < n; i++) {
        const sx = e.x + i * (e.w / n);
        ctx.fillStyle = COL.rebar; ctx.beginPath(); ctx.moveTo(sx + 0.5, e.base); ctx.lineTo(sx + e.w / n / 2, e.base - e.h); ctx.lineTo(sx + e.w / n - 0.5, e.base); ctx.fill();
        ctx.fillStyle = COL.rebarLo; ctx.fillRect(sx + e.w / n / 2 - 0.5, e.base - e.h + 3, 1, e.h - 3);
      }
    } else if (e.t === "hook") {
      ctx.fillStyle = "#3A4566"; ctx.fillRect(e.px - 6, 0, 12, 10);
      ctx.strokeStyle = "#9AA3B8"; ctx.lineWidth = 1.2; ctx.beginPath(); ctx.moveTo(e.px, e.py); ctx.lineTo(e.hx, e.hy - 6); ctx.stroke();
      ctx.save(); ctx.translate(e.hx, e.hy); ctx.rotate(-e.a);
      hazardRect(-7, -7, 14, 9);
      ctx.strokeStyle = COL.rebar; ctx.lineWidth = 2.2; ctx.beginPath(); ctx.moveTo(0, 2); ctx.lineTo(0, 6); ctx.arc(-3, 6, 3, 0, Math.PI, false); ctx.stroke();
      ctx.restore();
    }
  }
}

function drawDoor(x, y, label) {
  ctx.fillStyle = COL.frame; ctx.fillRect(x - 1, y, T + 2, 2 * T);
  ctx.fillStyle = COL.door; ctx.fillRect(x + 2, y + 3, T - 4, 2 * T - 3);
  ctx.fillStyle = COL.doorHi; ctx.fillRect(x + 2, y + 3, T - 4, 2);
  ctx.fillStyle = COL.doorLo; ctx.fillRect(x + 4, y + 8, T - 8, 8); ctx.fillRect(x + 4, y + 19, T - 8, 9);
  ctx.fillStyle = COL.hazard; ctx.fillRect(x + 10, y + 17, 2, 2);
  if (label) {
    ctx.fillStyle = COL.door; rr(x - 4, y - 10, T + 8, 8, 2); ctx.fill();
    ctx.fillStyle = COL.fg; ctx.font = "6px Bungee, Impact, sans-serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText(lang === "fr" ? "SORTIE" : "EXIT", x + 8, y - 5.6);
  }
}

function drawSigns() {
  ctx.font = "8px Bungee, Impact, sans-serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
  for (const s of L.signs) {
    const txt = s[lang], w = Math.ceil(ctx.measureText(txt).width) + 10, cx = s.c * T + 8, gy = (s.r + 1) * T, by = gy - 32;
    ctx.fillStyle = "#4B4033"; ctx.fillRect(cx - 1, by + 12, 2, gy - by - 12);
    ctx.fillStyle = COL.hazard; rr(cx - w / 2, by, w, 13, 2); ctx.fill();
    ctx.strokeStyle = COL.black; ctx.lineWidth = 1; ctx.strokeRect(cx - w / 2 + 1.5, by + 1.5, w - 3, 10);
    ctx.fillStyle = COL.black; ctx.fillText(txt, cx, by + 7);
  }
}

function drawPlayer(p, t) {
  if (p.gone) return;
  const cx = p.x + p.w / 2, by = p.y + p.h;
  let sx = 1 / p.sq, sy = p.sq;
  if (state === "win") { const u = 1 - winT / 42; sx *= 1 - u; sy *= 1 - u; }
  ctx.save(); ctx.translate(cx, by); ctx.scale(sx, sy);
  const step = p.run ? Math.sin(p.run * 0.35) : 0;
  ctx.fillStyle = "#2A3248";
  ctx.fillRect(-4 + step * 1.5, -3, 3, 3); ctx.fillRect(1 - step * 1.5, -3, 3, 3);
  ctx.fillStyle = COL.body; rr(-6, -13, 12, 11, 3); ctx.fill();
  ctx.fillStyle = COL.bodyLo; ctx.fillRect(-6, -5, 12, 2);
  const ex = p.face * 1.5;
  ctx.fillStyle = COL.eye; ctx.fillRect(-3.5 + ex, -10, 3, 3.5); ctx.fillRect(1 + ex, -10, 3, 3.5);
  ctx.fillStyle = COL.pupil; ctx.fillRect(-2.5 + ex + p.face * 0.6, -9, 1.5, 2); ctx.fillRect(2 + ex + p.face * 0.6, -9, 1.5, 2);
  drawHat(0, -13);
  ctx.restore();
}
function drawHat(x, y) {
  ctx.fillStyle = COL.hat; ctx.beginPath(); ctx.ellipse(x, y, 6.5, 4.5, 0, Math.PI, 0); ctx.fill();
  ctx.fillStyle = COL.hatLo; ctx.fillRect(x - 8, y - 1, 16, 2); ctx.fillRect(x - 1, y - 4.5, 2, 3.5);
}

function drawParts() {
  for (const q of parts) {
    const a = Math.min(1, q.life / 20);
    if (q.hat) { ctx.save(); ctx.translate(q.x, q.y); ctx.rotate(q.rot); ctx.globalAlpha = a; drawHat(0, 0); ctx.restore(); ctx.globalAlpha = 1; continue; }
    ctx.globalAlpha = q.dust ? a * 0.6 : a; ctx.fillStyle = q.c; ctx.fillRect(q.x - q.s / 2, q.y - q.s / 2, q.s, q.s);
  }
  ctx.globalAlpha = 1;
}

function text(t, x, y, font, color, align, outline) {
  ctx.font = font; ctx.textAlign = align || "left"; ctx.textBaseline = "alphabetic";
  if (outline) { ctx.lineWidth = outline; ctx.strokeStyle = COL.ink; ctx.lineJoin = "round"; ctx.strokeText(t, x, y); }
  ctx.fillStyle = color; ctx.fillText(t, x, y);
}

function drawHud() {
  text(`${S().lvl} ${cur + 1}/${LEVELS.length}`, 10, 18, "12px Bungee, Impact, sans-serif", COL.hazard, "left", 3);
  text(L.name[lang], 10, 31, "500 10px Rubik, system-ui, sans-serif", COL.fg2, "left", 3);
  text(`${S().attempt} ${levelTries}`, W - 10, 19, "14px Bungee, Impact, sans-serif", COL.fg, "right", 3);
  text(`${S().total} ${totalDeaths}`, W - 10, 31, "500 10px Rubik, system-ui, sans-serif", COL.fg2, "right", 3);
  if (banner > 0) {
    const a = Math.min(1, banner / 20, (120 - banner) / 12);
    ctx.globalAlpha = Math.max(0, a);
    text(`${S().level} ${cur + 1}`, W / 2, 86, "22px Bungee, Impact, sans-serif", COL.hazard, "center", 5);
    text(L.name[lang], W / 2, 106, "700 13px Rubik, system-ui, sans-serif", COL.fg, "center", 4);
    ctx.globalAlpha = 1;
  }
  if (quipT > 0) {
    ctx.globalAlpha = Math.min(1, quipT / 15);
    text(quip, W / 2, 140, "15px Bungee, Impact, sans-serif", COL.fg, "center", 5);
    ctx.globalAlpha = 1;
  }
}

function drawTitle() {
  drawBg();
  ctx.fillStyle = COL.rock; ctx.fillRect(0, 14 * T, W, H);
  ctx.fillStyle = COL.lip; ctx.fillRect(0, 14 * T, W, 3);
  hazardRect(0, 14 * T + 4, W, 6);
  text("ONE MORE", W / 2, 84, "34px Bungee, Impact, sans-serif", COL.fg, "center", 6);
  text("TRY", W / 2, 124, "44px Bungee, Impact, sans-serif", COL.hazard, "center", 7);
  text(S().sub, W / 2, 146, "700 13px Rubik, system-ui, sans-serif", COL.fg2, "center", 4);
  if (((frame / 30) | 0) % 2 === 0 || REDUCE) text(app.classList.contains("coarse") ? S().tap : S().key, W / 2, 176, "12px Bungee, Impact, sans-serif", COL.fg, "center", 4);
  if (cur > 0 && cur < LEVELS.length) text(S().resume(cur + 1, totalDeaths), W / 2, 196, "500 10px Rubik, system-ui, sans-serif", COL.fg2, "center", 3);
  const bob = REDUCE ? 0 : Math.abs(Math.sin(frame * 0.07)) * -8;
  drawPlayer({ x: W / 2 - 5, y: 14 * T - 13 + bob, w: 10, h: 13, face: 1, sq: bob < -6 ? 0.9 : 1, run: 0, gone: false });
  drawParts();
}

function render() {
  ctx.setTransform(k, 0, 0, k, 0, 0);
  if (state === "title") { drawTitle(); return; }
  const sx = shake ? (Math.random() - 0.5) * shake : 0, sy = shake ? (Math.random() - 0.5) * shake : 0;
  ctx.setTransform(k, 0, 0, k, sx * k, sy * k);
  drawBg();
  drawSigns();
  drawTiles();
  if (fake) drawDoor(fake.x, fake.y, true);
  drawDoor(door.x, door.y, true);
  drawEnts();
  drawPlayer(player);
  drawParts();
  ctx.setTransform(k, 0, 0, k, 0, 0);
  if (state === "end") { ctx.fillStyle = "rgba(15,19,32,.6)"; ctx.fillRect(0, 0, W, H); }
  else drawHud();
}

/* =========================================================
   FIN DE PARTIE / PARTAGE
   ========================================================= */
const fmtTime = f => { const s = Math.round(f / 60); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`; };
function showEnd() {
  document.getElementById("st-d").textContent = totalDeaths;
  document.getElementById("st-t").textContent = fmtTime(playFrames);
  document.getElementById("share-note").textContent = "";
  endEl.hidden = false;
  persist();
}
document.getElementById("b-replay").addEventListener("click", e => { e.currentTarget.blur(); replay(); });
document.getElementById("b-share").addEventListener("click", () => {
  const note = document.getElementById("share-note");
  const url = /^https?:/.test(location.href) && !/claude\.ai|claudeusercontent/.test(location.href) ? " " + location.href.split("#")[0] : "";
  const msg = S().shareTxt(totalDeaths, fmtTime(playFrames)) + url;
  const manual = () => { note.textContent = S().manual; const s = document.createElement("span"); s.className = "share-text"; s.textContent = msg; note.appendChild(s); };
  if (navigator.share) { navigator.share({ text: msg }).then(() => { note.textContent = S().shared; }, () => {}); return; }
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(msg).then(() => { note.textContent = S().copied; }, manual);
  else manual();
});

/* =========================================================
   INTERFACE
   ========================================================= */
const bSound = document.getElementById("b-sound"), bLang = document.getElementById("b-lang"), bRestart = document.getElementById("b-restart");
function applyLang() {
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-s]").forEach(el => { const v = S()[el.dataset.s]; if (typeof v === "string") el.textContent = v; });
  bLang.textContent = S().lang; bLang.setAttribute("aria-label", lang === "fr" ? "Switch to English" : "Passer en français");
  bRestart.setAttribute("aria-label", S().restart); bRestart.title = S().restart;
  bSound.setAttribute("aria-label", S().sound);
  if (!endEl.hidden) document.getElementById("share-note").textContent = "";
}
bLang.addEventListener("click", e => { lang = lang === "fr" ? "en" : "fr"; applyLang(); persist(); e.currentTarget.blur(); });
bSound.addEventListener("click", e => { muted = !muted; bSound.setAttribute("aria-pressed", String(!muted)); persist(); ensureAudio(); e.currentTarget.blur(); });
bRestart.addEventListener("click", e => { ensureAudio(); restart(); e.currentTarget.blur(); });
bSound.setAttribute("aria-pressed", String(!muted));
applyLang();

function fit() {
  const r = stage.getBoundingClientRect(), cs = getComputedStyle(stage);
  const aw = r.width - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
  const ah = r.height - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
  const cw = Math.max(160, Math.min(aw, ah * 16 / 9)), ch = cw * 9 / 16;
  const dpr = Math.min(window.devicePixelRatio || 1, 3);
  cv.style.width = cw + "px"; cv.style.height = ch + "px";
  cv.width = Math.round(cw * dpr); cv.height = Math.round(ch * dpr);
  k = cv.width / W;
}
if ("ResizeObserver" in window) new ResizeObserver(fit).observe(stage);
addEventListener("resize", fit); addEventListener("orientationchange", () => setTimeout(fit, 200));
fit();

let last = performance.now(), acc = 0, manual = false;
const STEP = 1000 / 60;
function loop(now) {
  let dt = now - last; last = now;
  if (dt > 250) dt = STEP;
  acc += dt;
  let n = 0;
  if (manual) acc = 0;
  while (acc >= STEP && n < 5) { update(); acc -= STEP; n++; }
  if (n === 5) acc = 0;
  render();
  requestAnimationFrame(loop);
}
document.addEventListener("visibilitychange", () => { last = performance.now(); acc = 0; });
requestAnimationFrame(loop);

/* test hook (used for automated checks) */
window.__omt = {
  go(i) { cur = i; startGame(); }, keys: kb, sync: syncKeys,
  pause() { manual = true; }, step(n) { for (let i = 0; i < n; i++) update(); },
  get state() { return state; }, get level() { return cur; }, get player() { return player; }, get tries() { return levelTries; },
  get ents() { return ents; }, get door() { return door; }
};
})();
</script>
